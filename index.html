<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="سامانه هوشمند پرسش و پاسخ" />
  <title>پرسش و پاسخ هوشمند</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">
        <i class="fas fa-comments"></i>
        <h1>پرسش و پاسخ هوشمند</h1>
      </div>
      <p class="tagline">سوالت رو بپرس، پاسخ بگیر، یاد بده!</p>
    </header>

    <main class="container">
      <section class="question-section">
        <div class="input-group">
          <textarea id="question" placeholder="سوال خود را اینجا بنویسید..." rows="4"></textarea>
          <div class="char-counter"><span id="char-count">0</span>/500</div>
        </div>
        <button class="submit-btn" id="submit-btn">
          <i class="fas fa-paper-plane"></i> ارسال سوال
        </button>
      </section>

      <section class="answer-section">
        <div class="answer-box" id="answer-box">
          <div class="answer-header">
            <i class="fas fa-lightbulb"></i>
            <h2>پاسخ:</h2>
          </div>
          <div class="answer-content">
            <p id="answer">بعد از ارسال سوال، پاسخ در اینجا نمایش داده می‌شود.</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>تمام حقوق محفوظ است &copy; <span id="year"></span></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
